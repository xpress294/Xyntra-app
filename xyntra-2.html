function esc(s){
  if(s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function hoyCorto(){
  const d = new Date();

function guardarTarifaEnFirestore(t){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  dbFirestore.collection("tarifas").doc(t.id).set(t).catch(err => console.error("Error guardando tarifa:", err));
}
function eliminarTarifaEnFirestore(id){

/* ============ SINCRONIZACIÓN CON FIRESTORE ============
   Cada colección (empleados, clientes, guias) se sube como semilla la
   primera vez que la base está vacía, y desde ahí queda escuchando
   cambios en vivo (onSnapshot) para que cualquier dispositivo que abra
   este mismo archivo vea siempre los mismos datos. *Listos pasa a true
   en cuanto llega la primera respuesta (vacía o con datos); el login
   espera a que ambas listas estén listas para no comparar contra datos
   incompletos. */
let empleadosListos = false;
let clientesListos = false;
let guiasListas = false;
let tarifasListas = false;

function guardarEmpleadoEnFirestore(e){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  dbFirestore.collection("empleados").doc(e.id).set(e).catch(err => console.error("Error guardando empleado:", err));
}
function guardarClienteEnFirestore(c){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  dbFirestore.collection("clientes").doc(c.id).set(c).catch(err => console.error("Error guardando cliente:", err));
}
function guardarGuiaEnFirestore(g){
  if(typeof dbFirestore === "undefined" || !dbFirestore) return;
  dbFirestore.collection("guias").doc(g.id).set(g).catch(err => console.error("Error guardando guía:", err));
}

function iniciarSincronizacionEmpleados(){
  if(typeof dbFirestore === "undefined" || !dbFirestore){ empleadosListos = true; return; }
  dbFirestore.collection("empleados").onSnapshot(snap => {
    if(snap.empty && !empleadosListos){
      EMPLEADOS.forEach(e => guardarEmpleadoEnFirestore(e));
      empleadosListos = true;
      return;
    }
    const lista = [];
    snap.forEach(doc => lista.push(doc.data()));
    EMPLEADOS.length = 0;
    lista.forEach(e => EMPLEADOS.push(e));
    empleadosListos = true;
    if(state.role) render();
  }, err => { console.error("Error sincronizando empleados:", err); empleadosListos = true; });
}
function iniciarSincronizacionClientes(){
  if(typeof dbFirestore === "undefined" || !dbFirestore){ clientesListos = true; return; }
  dbFirestore.collection("clientes").onSnapshot(snap => {
    if(snap.empty && !clientesListos){
      CLIENTES.forEach(c => guardarClienteEnFirestore(c));
      clientesListos = true;
      return;
    }
    const lista = [];
    snap.forEach(doc => lista.push(doc.data()));
    CLIENTES.length = 0;
    lista.forEach(c => CLIENTES.push(c));
    clientesListos = true;
    if(state.role) render();
  }, err => { console.error("Error sincronizando clientes:", err); clientesListos = true; });
}
function iniciarSincronizacionGuias(){
  if(typeof dbFirestore === "undefined" || !dbFirestore){ guiasListas = true; return; }
  dbFirestore.collection("guias").onSnapshot(snap => {
    if(snap.empty && !guiasListas){
      GUIAS.forEach(g => guardarGuiaEnFirestore(g));
      guiasListas = true;
      return;
    }
    const lista = [];
    snap.forEach(doc => lista.push(doc.data()));
    lista.sort((a,b) => (b.id||"").localeCompare(a.id||""));
    GUIAS.length = 0;
    lista.forEach(g => GUIAS.push(g));
    guiasListas = true;
    if(state.role) render();
  }, err => { console.error("Error sincronizando guías:", err); guiasListas = true; });
}

function iniciarSincronizacionTarifas(){
  if(typeof dbFirestore === "undefined" || !dbFirestore){ tarifasListas = true; return; }
  dbFirestore.collection("tarifas").onSnapshot(snap => {
    if(snap.empty && !tarifasListas){
      TARIFAS.forEach(t => guardarTarifaEnFirestore(t));
      tarifasListas = true;
      return;
    }
    const lista = [];
    snap.forEach(doc => lista.push(doc.data()));
    lista.sort((a,b) => (a.piezas||0) - (b.piezas||0));
    TARIFAS.length = 0;
    lista.forEach(t => TARIFAS.push(t));
    tarifasListas = true;
    if(state.role) render();
  }, err => { console.error("Error sincronizando tarifas:", err); tarifasListas = true; });
}

function onLoginClaveInput(v){ state.loginClave = v; }

function intentarLogin(){
  const correo = (state.loginCorreo || "").trim().toLowerCase();
  const clave = state.loginClave || "";
  if(!correo || !clave){
    state.loginError = "Escribe tu correo y contraseña.";
    render();
    return;
  }
  if(!empleadosListos || !clientesListos){
    state.loginError = "Cargando datos, espera un momento e intenta de nuevo.";
    render();
    return;
  }
  const empleado = EMPLEADOS.find(e => (e.correo||"").toLowerCase() === correo && (e.password||"") === clave);
  if(empleado){
    EMPLEADO_ACTUAL_ID = empleado.id;
    state.loginCorreo = ""; state.loginClave = ""; state.loginError = "";
    selectRole(empleado.rol);
    return;
  }
  const cliente = CLIENTES.find(c => (c.correo||"").toLowerCase() === correo && (c.password||"") === clave);
  if(cliente){
    CLIENTE_ACTUAL = cliente.comercio;
    state.loginCorreo = ""; state.loginClave = ""; state.loginError = "";
    selectRole("Cliente");
    return;
  }
  state.loginError = "Correo o contraseña incorrectos.";
  render();
}

function selectRole(role){
  state.role = role;
  state.view = NAV_BY_ROLE[role][0];
  render();
}
function logout(){
  state.role = null;
  EMPLEADO_ACTUAL_ID = null;
  CLIENTE_ACTUAL = null;
  render();
}
function navigate(view){
  state.view = view;
  state.selectedGuiaId = null;
  state.clienteEnEdicionId = null;
  state.sidebarAbierto = false;
  render();
}
function toggleSidebar(){ state.sidebarAbierto = !state.sidebarAbierto; render(); }
function cerrarSidebar(){ state.sidebarAbierto = false; render(); }

/* ============ NAV / LAYOUT ============ */
function buildNavHtml(role){
  return (NAV_BY_ROLE[role]||[]).map(key => {

    return `<button class="nav-btn ${active}" onclick="navigate('${key}')"><span>${item.icon}</span> ${item.label}</button>`;

function renderScreen(){
  switch(state.view){

    case "guias": return screenGuias();

function usuarioActualParaHistorial(){
  if(state.role === "Cliente") return { usuario: CLIENTE_ACTUAL || "Cliente", rol: "Cliente" };
  const e = empleadoActual();
  return { usuario: e ? e.nombre : "—", rol: state.role || "—" };
}
function registrarMovimientoGuia(g, descripcion){
  const { usuario, rol } = usuarioActualParaHistorial();
  if(!Array.isArray(g.historial)) g.historial = [];
  g.historial.push({ estado: descripcion, usuario, rol, fecha: ahoraLargo() });
}

function guiasVisiblesParaRol(){
  if(state.role === "Cliente") return GUIAS.filter(g => g.cliente === CLIENTE_ACTUAL);
  if(state.role === "Piloto") return GUIAS.filter(g => g.piloto === (empleadoActual()||{}).nombre);
  return GUIAS.slice();
}
function chipEstado(estado){
  const map = { "Entregado":"chip-green","Finalizado":"chip-green","Devolución":"chip-red","Pendiente":"chip-amber" };
  return `<span class="chip ${map[estado]||''}">${esc(estado)}</span>`;
}

function confirmarCrearGuia(){
  const esAdmin = state.role === "Super Administrativo" || state.role === "Administrativo";
  const cliente = esAdmin ? state.crearGuiaClienteSel : CLIENTE_ACTUAL;
  if(!cliente){ alert("Selecciona un cliente."); return; }
  if(!state.crearGuiaNombre.trim()){ alert("Ingresa el nombre del destinatario."); return; }
  if(!state.crearGuiaTelefono.trim()){ alert("Ingresa el teléfono del destinatario."); return; }
  if(!state.crearGuiaDireccion.trim()){ alert("Ingresa la dirección de entrega."); return; }
  if(!state.crearGuiaDepto){ alert("Selecciona el departamento."); return; }
  if(!state.crearGuiaMunicipio){ alert("Selecciona el municipio."); return; }
  if(!state.crearGuiaPiezas || Number(state.crearGuiaPiezas) < 1){ alert("Indica cuántas piezas son."); return; }
  if(state.crearGuiaValor === "" || Number(state.crearGuiaValor) < 0){ alert("Indica el valor del paquete."); return; }

  const { usuario, rol } = usuarioActualParaHistorial();
  const nuevo = {
    id: "YN" + (nextGuiaNum++),
    cliente: cliente,
    estado: "Creada",
    fecha: hoyCorto(),
    piloto: "-",
    creadoPor: esAdmin ? nombreCortoUsuarioActual() : cliente,
    creadoPorTipo: esAdmin ? state.role : "Cliente",
    nombreDestinatario: state.crearGuiaNombre.trim(),
    telefonoDestinatario: state.crearGuiaTelefono.trim(),
    direccion: state.crearGuiaDireccion.trim(),
    departamento: state.crearGuiaDepto,
    municipio: state.crearGuiaMunicipio,
    fragil: state.crearGuiaFragil,
    piezas: Number(state.crearGuiaPiezas),
    valor: Number(state.crearGuiaValor),
    historial: [{ estado: "Creada", usuario, rol, fecha: ahoraLargo() }],
  };
  GUIAS.unshift(nuevo);
  guardarGuiaEnFirestore(nuevo);
  state.crearGuiaClienteSel = "";
  state.crearGuiaNombre = "";
  state.crearGuiaTelefono = "";
  state.crearGuiaDireccion = "";
  state.crearGuiaDepto = "";
  state.crearGuiaMunicipio = "";
  state.crearGuiaFragil = false;
  state.crearGuiaPiezas = "1";

  navigate(state.role === "Cliente" ? "misguias" : "guias");
}

/* ============ CÓDIGO QR DE LA GUÍA ============ */
function textoQrGuia(g){
  return [
    "GUIA: " + g.id,
    "Cliente: " + g.cliente,
    "Destinatario: " + (g.nombreDestinatario||"-"),
    "Tel: " + (g.telefonoDestinatario||"-"),
    "Dir: " + (g.direccion||"-") + ", " + (g.municipio||"-") + ", " + (g.departamento||"-"),
    "Piezas: " + (g.piezas||"-"),
    "Valor: $" + (g.valor!==undefined ? Number(g.valor).toFixed(2) : "-"),
    "Frágil: " + (g.fragil ? "SÍ" : "No"),
  ].join(" | ");
}
function urlQrGuia(g){
  return "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=" + encodeURIComponent(textoQrGuia(g));
}

/* ============ PRECIO DE ENVÍOS (editable solo Super Administrativo) ============ */
function onTarifaPiezasForm(v){ state.tarifaPiezasForm = v; }
function onTarifaValorForm(v){ state.tarifaValorForm = v; }
function onTarifaTipoProductoForm(v){ state.tarifaTipoProductoForm = v; }

function guardarTarifaForm(){
  const piezas = Number(state.tarifaPiezasForm);
  const valor = Number(state.tarifaValorForm);
  const tipoProducto = (state.tarifaTipoProductoForm||"").trim();
  if(!piezas || piezas < 1){ alert("Indica cuántas piezas."); return; }
  if(state.tarifaValorForm === "" || valor < 0){ alert("Indica el valor de envío."); return; }
  if(!tipoProducto){ alert("Indica el tipo de producto."); return; }

  if(state.tarifaEnEdicionId){
    const t = TARIFAS.find(x => x.id === state.tarifaEnEdicionId);
    if(t){ t.piezas = piezas; t.valor = valor; t.tipoProducto = tipoProducto; guardarTarifaEnFirestore(t); }
  } else {
    const existente = TARIFAS.find(x => Number(x.piezas) === piezas && (x.tipoProducto||"").toLowerCase() === tipoProducto.toLowerCase());
    if(existente){ alert("Ya existe una tarifa para ese tipo de producto y esa cantidad de piezas. Edítala en vez de crear otra."); return; }
    const nueva = { id: uid("T-"), piezas, valor, tipoProducto };
    TARIFAS.push(nueva);
    guardarTarifaEnFirestore(nueva);
  }
  TARIFAS.sort((a,b) => (a.piezas||0) - (b.piezas||0));
  state.tarifaEnEdicionId = null;
  state.tarifaPiezasForm = "";
  state.tarifaValorForm = "";
  state.tarifaTipoProductoForm = "";
  render();
}
function editarTarifa(id){
  const t = TARIFAS.find(x => x.id === id);
  if(!t) return;
  state.tarifaEnEdicionId = id;
  state.tarifaPiezasForm = String(t.piezas);
  state.tarifaValorForm = String(t.valor);
  state.tarifaTipoProductoForm = t.tipoProducto || "";
  render();
}
function cancelarEdicionTarifa(){
  state.tarifaEnEdicionId = null;
  state.tarifaPiezasForm = "";
  state.tarifaValorForm = "";
  state.tarifaTipoProductoForm = "";
  render();
}
function borrarTarifa(id){
  if(!confirm("¿Eliminar esta tarifa?")) return;
  const i = TARIFAS.findIndex(x => x.id === id);
  if(i > -1) TARIFAS.splice(i, 1);
  eliminarTarifaEnFirestore(id);
  if(state.tarifaEnEdicionId === id) cancelarEdicionTarifa();
  render();
}

function screenTarifas(){
  const esSuperAdmin = state.role === "Super Administrativo";
  const lista = TARIFAS.slice().sort((a,b) => (a.piezas||0) - (b.piezas||0));
  return `
  <div class="page-header"><div><h1>Precio de Envíos</h1><p>${esSuperAdmin ? "Escribe y actualiza el precio según la cantidad de piezas" : "Consulta el precio de envío según la cantidad de piezas"}</p></div></div>

  ${esSuperAdmin ? `
  <div class="card" style="max-width:480px;">
    <p class="hint" style="font-weight:600;color:var(--navy);margin:0 0 10px 0;">${state.tarifaEnEdicionId ? "Editar tarifa" : "Agregar nueva tarifa"}</p>
    <div class="field">
      <label>Tipo de producto</label>
      <input type="text" placeholder="Ej. Documentos, Ropa, Electrónica…" value="${esc(state.tarifaTipoProductoForm)}" oninput="onTarifaTipoProductoForm(this.value)" />
    </div>
    <div class="grid2">
      <div class="field">
        <label>Cantidad de piezas</label>
        <input type="number" min="1" placeholder="Ej. 1" value="${esc(state.tarifaPiezasForm)}" oninput="onTarifaPiezasForm(this.value)" />
      </div>
      <div class="field">
        <label>Valor de envío (US$)</label>
        <input type="number" min="0" step="0.01" placeholder="0.00" value="${esc(state.tarifaValorForm)}" oninput="onTarifaValorForm(this.value)" />
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-orange" style="flex:1;" onclick="guardarTarifaForm()">${state.tarifaEnEdicionId ? "Guardar cambios" : "Agregar tarifa"}</button>
      ${state.tarifaEnEdicionId ? `<button class="btn btn-outline" onclick="cancelarEdicionTarifa()">Cancelar</button>` : ""}
    </div>
  </div>` : ""}

  <div class="card">
    <table>
      <thead><tr><th>Tipo de producto</th><th>Piezas</th><th>Valor de envío</th>${esSuperAdmin ? "<th></th>" : ""}</tr></thead>
      <tbody>
        ${lista.map(t => `
          <tr>
            <td>${esc(t.tipoProducto || "General")}</td>
            <td><b>${esc(t.piezas)}</b> pieza(s)</td>
            <td>$${Number(t.valor).toFixed(2)}</td>
            ${esSuperAdmin ? `
            <td>
              <button class="btn-link" onclick="editarTarifa('${t.id}')">Editar</button>
              &nbsp;·&nbsp;
              <button class="btn-link" style="color:var(--red);" onclick="borrarTarifa('${t.id}')">Eliminar</button>
            </td>` : ""}
          </tr>
        `).join("") || `<tr><td colspan="${esSuperAdmin?4:3}" class="hint">Aún no hay tarifas registradas.</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

/* ============ CLIENTES (roles administrativos) ============ */
function onClienteFiltro(v){ state.clienteFiltro = v; render(); }
function screenClientes(){
  const filtro = (state.clienteFiltro||"").toLowerCase();
  let lista = CLIENTES.slice();
  if(filtro) lista = lista.filter(c => c.comercio.toLowerCase().includes(filtro) || (c.correo||"").toLowerCase().includes(filtro));
  return `
  <div class="page-header"><div><h1>Clientes</h1><p>${lista.length} cliente(s)</p></div>
    <button class="btn btn-orange" onclick="abrirNuevoCliente()">➕ Nuevo cliente</button>
  </div>
  <div class="card">
    <input type="text" placeholder="Buscar por comercio o correo..." value="${esc(state.clienteFiltro)}" oninput="onClienteFiltro(this.value)" style="margin-bottom:14px;" />
    <table>
      <thead><tr><th>Comercio</th><th>Teléfono</th><th>Correo</th><th>Registrado</th><th></th></tr></thead>
      <tbody>
        ${lista.map(c => `
          <tr>
            <td><b>${esc(c.comercio)}</b></td>
            <td>${esc(c.telefono)}</td>
            <td>${esc(c.correo)}</td>
            <td>${esc(c.fechaRegistro)}</td>
            <td><button class="btn-link" onclick="editarCliente('${c.id}')">Editar</button></td>
          </tr>
        `).join("") || `<tr><td colspan="5" class="hint">No hay clientes.</td></tr>`}
      </tbody>
    </table>
  </div>
  ${state.clienteEnEdicionId !== null ? screenFormCliente() : ""}`;
}
function abrirNuevoCliente(){ state.clienteEnEdicionId = "nuevo"; render(); }
function editarCliente(id){ state.clienteEnEdicionId = id; render(); }
function cerrarFormCliente(){ state.clienteEnEdicionId = null; render(); }

function screenFormCliente(){
  const esNuevo = state.clienteEnEdicionId === "nuevo";
  const c = esNuevo ? { comercio:"", telefono:"", direccion:"", correo:"", password:"" } : CLIENTES.find(x => x.id === state.clienteEnEdicionId);
  if(!c) return "";
  return `
  <div class="card" style="max-width:480px;">
    <h1 style="font-size:18px;margin:0 0 14px 0;">${esNuevo ? "Nuevo cliente" : "Editar cliente"}</h1>
    <div class="field"><label>Comercio</label><input id="cf_comercio" value="${esc(c.comercio)}" /></div>
    <div class="field"><label>Teléfono</label><input id="cf_telefono" value="${esc(c.telefono)}" /></div>
    <div class="field"><label>Dirección</label><input id="cf_direccion" value="${esc(c.direccion||'')}" /></div>
    <div class="field"><label>Correo</label><input id="cf_correo" value="${esc(c.correo)}" /></div>
    <div class="field"><label>Contraseña</label><input id="cf_password" value="${esc(c.password)}" /></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-orange" onclick="guardarCliente()">Guardar</button>
      <button class="btn btn-outline" onclick="cerrarFormCliente()">Cancelar</button>
    </div>
  </div>`;
}
function guardarCliente(){
  const comercio = document.getElementById("cf_comercio").value.trim();
  const telefono = document.getElementById("cf_telefono").value.trim();
  const direccion = document.getElementById("cf_direccion").value.trim();
  const correo = document.getElementById("cf_correo").value.trim();
  const password = document.getElementById("cf_password").value.trim();
  if(!comercio || !correo || !password){ alert("Comercio, correo y contraseña son obligatorios."); return; }
  if(state.clienteEnEdicionId === "nuevo"){
    const nuevo = { id: uid("C-"), comercio, telefono, direccion, correo, password, fechaRegistro: ahoraLargo(), creadoPor: nombreCortoUsuarioActual() };
    CLIENTES.push(nuevo);
    guardarClienteEnFirestore(nuevo);
  } else {
    const c = CLIENTES.find(x => x.id === state.clienteEnEdicionId);
    if(c){ c.comercio=comercio; c.telefono=telefono; c.direccion=direccion; c.correo=correo; c.password=password; guardarClienteEnFirestore(c); }
  }
  state.clienteEnEdicionId = null;
  render();
}

/* ============ EMPLEADOS (solo Super Administrativo) — necesarios para asignar Roles ============ */
function screenEmpleados(){
  if(state.role !== "Super Administrativo") return `<div class="card">No tienes acceso a esta sección.</div>`;
  return `
  <div class="page-header"><div><h1>Empleados</h1><p>Usuarios internos y asignación de roles</p></div>
    <button class="btn btn-orange" onclick="state.empleadoNuevo=true;render();">➕ Nuevo empleado</button>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Rol</th></tr></thead>
      <tbody>
        ${EMPLEADOS.map(e => `
          <tr><td><b>${esc(e.nombre)}</b></td><td>${esc(e.telefono)}</td><td>${esc(e.correo)}</td><td><span class="chip">${esc(e.rol)}</span></td></tr>
        `).join("")}
      </tbody>
    </table>
  </div>
  ${state.empleadoNuevo ? `
  <div class="card" style="max-width:480px;">
    <h1 style="font-size:18px;margin:0 0 14px 0;">Nuevo empleado</h1>
    <div class="field"><label>Nombre</label><input id="ef_nombre" /></div>
    <div class="field"><label>Teléfono</label><input id="ef_telefono" /></div>
    <div class="field"><label>Correo</label><input id="ef_correo" /></div>
    <div class="field"><label>Contraseña</label><input id="ef_password" /></div>
    <div class="field"><label>Rol</label>
      <select id="ef_rol">
        <option>Administrativo</option>
        <option>Piloto</option>
        <option>Super Administrativo</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-orange" onclick="guardarEmpleado()">Guardar</button>
      <button class="btn btn-outline" onclick="state.empleadoNuevo=false;render();">Cancelar</button>
    </div>
  </div>` : ""}`;
}
function guardarEmpleado(){
  const nombre = document.getElementById("ef_nombre").value.trim();
  const telefono = document.getElementById("ef_telefono").value.trim();
  const correo = document.getElementById("ef_correo").value.trim();
  const password = document.getElementById("ef_password").value.trim();
  const rol = document.getElementById("ef_rol").value;
  if(!nombre || !correo || !password){ alert("Nombre, correo y contraseña son obligatorios."); return; }
  const nuevo = { id: uid("E-"), nombre, telefono, correo, password, rol };
  EMPLEADOS.push(nuevo);
  guardarEmpleadoEnFirestore(nuevo);
  state.empleadoNuevo = false;
  render();
}

/* ============ ROLES (solo lectura) ============ */
function screenRoles(){
  return `
  <div class="page-header"><div><h1>Roles</h1><p>Los roles se asignan al crear un usuario en Empleados o Clientes</p></div></div>
  <div class="card">
    ${ROLES.map(r => `
      <div style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);">
        <div style="font-size:22px;">${r.icon}</div>
        <div><b>${esc(r.key)}</b><div class="hint">${esc(r.desc)}</div></div>
      </div>
    `).join("")}
  </div>`;
}

/* ============ PERFIL ============ */
function screenPerfil(){
  if(state.role === "Cliente"){
    const c = clienteActual();
    return `
    <div class="page-header"><div><h1>Mi Perfil</h1></div></div>
    <div class="card" style="max-width:480px;">
      <div class="field"><label>Comercio</label><input value="${esc(c.comercio)}" disabled /></div>
      <div class="field"><label>Teléfono</label><input value="${esc(c.telefono)}" disabled /></div>
      <div class="field"><label>Correo</label><input value="${esc(c.correo)}" disabled /></div>
    </div>`;
  }
  const e = empleadoActual();
  return `
  <div class="page-header"><div><h1>Mi Perfil</h1></div></div>
  <div class="card" style="max-width:480px;">
    <div class="field"><label>Nombre</label><input value="${esc(e.nombre)}" disabled /></div>
    <div class="field"><label>Teléfono</label><input value="${esc(e.telefono)}" disabled /></div>
    <div class="field"><label>Correo</label><input value="${esc(e.correo)}" disabled /></div>
    <div class="field"><label>Rol</label><input value="${esc(e.rol)}" disabled /></div>
  </div>`;
}

/* ============ RENDER PRINCIPAL ============ */
function render(){
  const app = document.getElementById("app");
  if(!state.role){
    app.innerHTML = screenLogin();
    return;
  }
  app.innerHTML = `
    <div class="sidebar-overlay ${state.sidebarAbierto ? 'show':''}" onclick="cerrarSidebar()"></div>
    <div class="sidebar ${state.sidebarAbierto ? 'open':''}">
      <div class="sidebar-logo"><span class="box">Xyntra</span></div>
      <div class="session-box"><small>Sesión activa</small><strong>${esc(nombreCortoUsuarioActual())} · ${esc(state.role)}</strong></div>
      <div class="nav">${buildNavHtml(state.role)}</div>
      <button class="logout-btn" onclick="logout()"><span>↩</span> Cerrar sesión</button>
    </div>
    <main>
      <div class="mobile-topbar">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <b>Xyntra</b>
        <span class="role-chip">${esc(nombreCortoUsuarioActual())}</span>
      </div>
      <div class="main-content">${renderScreen()}</div>
    </main>
  `;
}

iniciarSincronizacionEmpleados();
iniciarSincronizacionClientes();
iniciarSincronizacionGuias();
iniciarSincronizacionTarifas();
render();
</script>
</body>
</html>
